<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tournament Card</title>
  <style>
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* Container / Card background */
    .card {
      position: relative;
      width: 400px;
      height: 220px;
      background: linear-gradient(135deg, #2b61d6 0%, #1a3c8e 100%);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Badge Outer Box */
    .badge-container {
      position: relative;
      display: inline-block;
      margin-top: 10px;
    }

    /* Red LIVE tag on top-left border */
    .live-tag {
      position: absolute;
      top: -8px;
      left: 12px;
      background-color: #ff2a4b;
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      z-index: 2;
      text-transform: uppercase;
    }

    /* Main Pill/Button Box */
    .tournament-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #0b0f19;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid #1e283d;
      font-weight: 900;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    /* Flag styling */
    .flag-icon {
      width: 24px;
      height: auto;
      border-radius: 2px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge-container">
      <span class="live-tag">LIVE</span>
      <div class="tournament-badge">
        <span>USA GTA 5 TOURNAMENT</span>
        <!-- US Flag SVG -->
        <svg class="flag-icon" viewBox="0 0 640 480">
          <g fill-rule="evenodd">
            <path fill="#bd3d44" d="M0 0h640v480H0z"/>
            <path fill="#fff" d="M0 36.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0z"/>
            <path fill="#192f5d" d="M0 0h280v258.5H0z"/>
            <g fill="#fff">
              <path d="M24.7 13l2.8 8.6h9l-7.3 5.3 2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.3h9z"/>
              <path d="M72.2 13l2.8 8.6h9l-7.3 5.3 2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.3h9z"/>
              <path d="M119.8 13l2.8 8.6h9l-7.3 5.3 2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.3h9z"/>
              <path d="M167.3 13l2.8 8.6h9l-7.3 5.3 2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.3h9z"/>
              <path d="M214.8 13l2.8 8.6h9l-7.3 5.3 2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.3h9z"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
